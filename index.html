    if(m.tagName==='VIDEO'){im.style.display='none';vd.style.display='block';vd.src=src;var p=vd.play();if(p&&p.catch)p.catch(function(){});}

<script>
(function(){
  var vm=document.getElementById('vm'),box=vm.querySelector('.vm-box'),yt=vm.querySelector('.vm-yt');
  function idOf(u){var m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:null;}
  var viol=null,msgH=null;
  function close(){vm.classList.remove('open');vm.setAttribute('aria-hidden','true');box.innerHTML='';if(viol){document.removeEventListener('securitypolicyviolation',viol);viol=null;}if(msgH){window.removeEventListener('message',msgH);msgH=null;}}
  function errMsg(c){
    if(c===101||c===150)return 'El propietario del video no permite reproducirlo en otras páginas. En YouTube Studio, abre el video → Detalles → Mostrar más y activa «Permitir incrustación».';
    if(c===153)return 'YouTube bloqueó el reproductor porque esta página no le envía la información de origen que exige (error 153). Depende de dónde esté alojada la página.';
    if(c===100)return 'El video no está disponible o es privado.';
    return 'YouTube no pudo reproducir el video aquí (código '+c+').';
  }
  function fail(url,msg){
    box.innerHTML='';
    var d=document.createElement('div');d.className='vm-fail';
    var p=document.createElement('p');p.textContent=msg||'Este entorno no permite reproducir YouTube dentro de la página.';
    var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Ver el Demoreel en YouTube ↗';
    d.appendChild(p);d.appendChild(a);box.appendChild(d);
  }
  window.openDemoreel=function(url){
    var id=idOf(url);if(!id){window.open(url,'_blank','noopener');return;}
    var hosts=['www.youtube.com','www.youtube-nocookie.com'],hi=0;
    function mount(){
      box.innerHTML='';
      var f=document.createElement('iframe');
      f.src='https://'+hosts[hi]+'/embed/'+id+'?autoplay=1&rel=0&playsinline=1&enablejsapi=1';
      f.title='Demoreel';f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';
      f.addEventListener('load',function(){try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*');}catch(_){}});
      box.appendChild(f);
    }
    if(viol)document.removeEventListener('securitypolicyviolation',viol);
    viol=function(e){
      if(!/^(frame|child)-src/.test(e.violatedDirective||'')||String(e.blockedURI).indexOf('youtube')<0)return;
      if(hi<hosts.length-1){hi++;mount();}else{fail(url);}
    };
    document.addEventListener('securitypolicyviolation',viol);
    if(msgH)window.removeEventListener('message',msgH);
    msgH=function(e){
      var fr=box.querySelector('iframe');if(!fr||e.source!==fr.contentWindow)return;
      var d=e.data;if(typeof d==='string'){try{d=JSON.parse(d);}catch(_){return;}}
      if(d&&d.event==='onError')fail(url,errMsg(Number(d.info)));
    };
    window.addEventListener('message',msgH);
    mount();yt.href=url;vm.classList.add('open');vm.setAttribute('aria-hidden','false');
  };
  vm.addEventListener('click',function(e){if(e.target===vm)close();});
  vm.querySelector('.vm-x').addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>
<script>
(function(){

  function say(m){t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2800);}
  function legacy(v){return new Promise(function(res,rej){var a=document.createElement('textarea');a.value=v;a.setAttribute('readonly','');a.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,v.length);var ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();if(ok)res();else rej();});}
  function copy(v){
    if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext)return navigator.clipboard.writeText(v).catch(function(){return legacy(v);});
    return legacy(v);
  }
  function go(el){var v=el.getAttribute('data-copy'),l=el.getAttribute('data-label');copy(v).then(function(){say(l+' copiado: '+v);},function(){say('No se pudo copiar solo. '+l+': '+v);});}
  document.addEventListener('click',function(e){var el=e.target.closest&&e.target.closest('.cp');if(el)go(el);});
  document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cp')){e.preventDefault();go(e.target);}});
